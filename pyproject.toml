[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xrobot"
version = "1.0.0"
description = "Source package resolution and static C++ application assembly for the XRobot ecosystem."
requires-python = ">=3.10"
authors = [
    {name = "Xiao", email = "2592509183@qq.com"}
]
maintainers = [
    {name = "Xiao", email = "2592509183@qq.com"}
]
readme = "README.md"
license = {text = "Apache-2.0"}
keywords = ["code generation", "embedded systems", "automation"]
dependencies = [
    "pyyaml",
    "requests",
    "ruamel.yaml>=0.17.21,<0.19",
    "xr-syntax==0.2.0"
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/xrobot-org"
Documentation = "https://xrobot.work"
Repository = "https://github.com/xrobot-org/XRobot"
"Bug Tracker" = "https://github.com/xrobot-org/XRobot/issues"

[project.scripts]
xrobot = "xrobot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
