name: module-parser-parity

on:
  push:
    branches:
      - feat/xr-syntax-module-parser-20260919

permissions:
  contents: read

jobs:
  parity:
    if: github.event.head_commit.message == 'Run GenerateMain parity'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install .
      - name: Prepare legacy consumers
        run: |
          git show 15bff04ec4a21c2fdb31d4411e2802851e3de4c9:src/xrobot/ModuleParser.py > /tmp/legacy_module_parser.py
          git show 15bff04ec4a21c2fdb31d4411e2802851e3de4c9:src/xrobot/GenerateMain.py > /tmp/legacy_generate_main.py
      - name: Clone official modules
        run: |
          git clone --depth=1 https://github.com/xrobot-org/xrobot-modules.git /tmp/xrobot-index
          mkdir -p /tmp/xrobot-modules
          python - <<'PY' >/tmp/module-urls.txt
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path("/tmp/xrobot-index/index.yaml").read_text())
          for url in data["modules"]:
              print(url)
          PY
          while IFS= read -r url; do
            name="$(basename "${url%.git}")"
            git clone --depth=1 "$url" "/tmp/xrobot-modules/$name"
          done </tmp/module-urls.txt
      - name: Compare legacy and xr-syntax-backed consumers
        run: |
          python - <<'PY'
          import copy
          import importlib.util
          import json
          from pathlib import Path

          from xrobot import GenerateMain as new_generate
          from xrobot.ModuleParser import (
              parse_constructor_args as new_parse_args,
              parse_manifest_from_header as new_module_parse,
          )

          def load_module(name, path):
              spec = importlib.util.spec_from_file_location(name, path)
              module = importlib.util.module_from_spec(spec)
              assert spec.loader is not None
              spec.loader.exec_module(module)
              return module

          legacy_module = load_module(
              "legacy_module_parser", "/tmp/legacy_module_parser.py"
          )
          legacy_generate = load_module(
              "legacy_generate_main", "/tmp/legacy_generate_main.py"
          )

          rows = []
          mismatches = []
          root = Path("/tmp/xrobot-modules")
          for module in sorted(p for p in root.iterdir() if p.is_dir()):
              header = module / f"{module.name}.hpp"
              row = {"module": module.name}
              if not header.exists():
                  row["status"] = "missing-primary-header"
                  mismatches.append(row)
                  rows.append(row)
                  continue

              old_manifest = legacy_module.parse_manifest_from_header(header)
              new_manifest = new_module_parse(header)
              old_data = None if old_manifest is None else old_manifest.as_dict()
              new_data = None if new_manifest is None else new_manifest.as_dict()
              row["module_parser_equal"] = old_data == new_data
              if not row["module_parser_equal"]:
                  row["status"] = "module-parser-mismatch"
                  mismatches.append(row)
                  rows.append(row)
                  continue

              if old_manifest is not None and new_manifest is not None:
                  old_ctor = list(
                      legacy_module.parse_constructor_args(
                          old_manifest.constructor_args
                      ).items()
                  )
                  new_ctor = list(
                      new_parse_args(new_manifest.constructor_args).items()
                  )
                  old_tpl = list(
                      legacy_module.parse_constructor_args(
                          old_manifest.template_args
                      ).items()
                  )
                  new_tpl = list(
                      new_parse_args(new_manifest.template_args).items()
                  )
                  if old_ctor != new_ctor or old_tpl != new_tpl:
                      row["status"] = "module-args-mismatch"
                      mismatches.append(row)
                      rows.append(row)
                      continue

              old_generate_manifest = legacy_generate.parse_manifest_from_header(header)
              new_generate_manifest = new_generate.parse_manifest_from_header(header)
              if old_generate_manifest != new_generate_manifest:
                  row["status"] = "generate-main-manifest-mismatch"
                  mismatches.append(row)
                  rows.append(row)
                  continue

              row["status"] = "match"
              rows.append(row)

          codegen_cases = [
              (
                  "simple",
                  "hw",
                  ["BlinkLED"],
                  {
                      "global_settings": {"monitor_sleep_ms": 250},
                      "modules": [
                          {
                              "id": "BlinkLED_0",
                              "name": "BlinkLED",
                              "constructor_args": {"blink_cycle": 500},
                          }
                      ],
                  },
              ),
              (
                  "auto-instance-and-values",
                  "board",
                  ["Demo"],
                  {
                      "global_settings": {"monitor_sleep_ms": 7},
                      "modules": [
                          {
                              "name": "Demo",
                              "constructor_args": {
                                  "enabled": True,
                                  "label": {"string": "abc"},
                                  "raw": {"expr": "Factory::Make(1, 2)"},
                                  "items": [1, 2, 3],
                              },
                          },
                          {
                              "name": "Demo",
                              "constructor_args": {"ref": "@demo"},
                          },
                      ],
                  },
              ),
              (
                  "long-arguments",
                  "hardware",
                  ["LongModule"],
                  {
                      "modules": [
                          {
                              "id": "long_module_instance",
                              "name": "LongModule",
                              "constructor_args": {
                                  "first": "a very long string argument used to force multiline formatting",
                                  "second": "another long string argument used to force multiline formatting",
                                  "third": 123456789,
                              },
                          }
                      ],
                  },
              ),
              (
                  "long-template",
                  "hw",
                  ["VeryLongModuleNameForTemplateFormatting"],
                  {
                      "modules": [
                          {
                              "id": "templated",
                              "name": "VeryLongModuleNameForTemplateFormatting",
                              "template_args": {
                                  "A": "ExtremelyLongTemplateParameterNameOne",
                                  "B": "ExtremelyLongTemplateParameterNameTwo",
                              },
                              "constructor_args": {"value": 42},
                          }
                      ],
                  },
              ),
              (
                  "constexpr",
                  "hw",
                  ["Demo"],
                  {
                      "constexpr_namespace": "ProjectConfig",
                      "constexpr_includes": [
                          "<array>",
                          '"types.hpp"',
                          "local.hpp",
                          "<array>",
                      ],
                      "constexprs": {
                          "Period": {"type": "uint32_t", "value": 250},
                          "Axes": {"type": "std::array<int, 3>", "value": [1, 2, 3]},
                      },
                      "modules": [
                          {
                              "id": "demo",
                              "name": "Demo",
                              "constructor_args": {
                                  "period": {"constexpr": "Period"},
                                  "mode": {"expr": "Mode::FAST"},
                              },
                          }
                      ],
                  },
              ),
          ]

          codegen_rows = []
          codegen_mismatches = []
          for name, hw, modules, config in codegen_cases:
              old_config = copy.deepcopy(config)
              new_config = copy.deepcopy(config)
              old_main = legacy_generate.generate_xrobot_main_code(
                  hw, modules, old_config
              )
              new_main = new_generate.generate_xrobot_main_code(
                  hw, modules, new_config
              )
              old_constexpr = legacy_generate._generate_constexpr_header(
                  copy.deepcopy(config)
              )
              new_constexpr = new_generate._generate_constexpr_header(
                  copy.deepcopy(config)
              )
              row = {
                  "name": name,
                  "main_equal": old_main == new_main,
                  "constexpr_equal": old_constexpr == new_constexpr,
              }
              if not row["main_equal"]:
                  row["old_main"] = old_main
                  row["new_main"] = new_main
              if not row["constexpr_equal"]:
                  row["old_constexpr"] = old_constexpr
                  row["new_constexpr"] = new_constexpr
              if not row["main_equal"] or not row["constexpr_equal"]:
                  codegen_mismatches.append(row)
              codegen_rows.append(row)

          result = {
              "modules": len(rows),
              "matches": sum(row["status"] == "match" for row in rows),
              "mismatches": len(mismatches),
              "codegen_cases": len(codegen_rows),
              "codegen_mismatches": len(codegen_mismatches),
              "rows": rows,
              "mismatch_rows": mismatches,
              "codegen_rows": codegen_rows,
          }
          Path("module-parser-parity.json").write_text(
              json.dumps(result, indent=2, ensure_ascii=False),
              encoding="utf-8",
          )
          print(
              f"modules={result['modules']} matches={result['matches']} "
              f"mismatches={result['mismatches']} "
              f"codegen_cases={result['codegen_cases']} "
              f"codegen_mismatches={result['codegen_mismatches']}"
          )
          for row in mismatches:
              print("MISMATCH", row["module"], row["status"])
          for row in codegen_mismatches:
              print("CODEGEN_MISMATCH", row["name"])
              if not row["main_equal"]:
                  print("OLD_MAIN")
                  print(row["old_main"])
                  print("NEW_MAIN")
                  print(row["new_main"])
          if mismatches or codegen_mismatches:
              raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: module-parser-parity
          path: module-parser-parity.json
