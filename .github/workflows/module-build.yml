name: Native Module compile check
on:
  workflow_call:
    inputs:
      libxr_ref:
        type: string
        default: dev
      tooling_ref:
        type: string
        default: dev
      image:
        type: string
        default: ghcr.io/xrobot-org/docker-image-linux:main
      system:
        type: string
        default: Linux
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    container:
      image: ${{ inputs.image }}
    env:
      XR_MODULE_ID: ${{ github.repository }}
      XR_SOURCE_URL: ${{ github.event.pull_request.head.repo.clone_url || format('https://github.com/{0}.git', github.repository) }}
      XR_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      XR_SOURCE_CONTEXT: ${{ github.event_name == 'pull_request' && format('refs/heads/{0}', github.head_ref) || github.ref }}
      XR_SYSTEM: ${{ inputs.system }}
    steps:
      - name: Checkout coordinated XRobot tooling
        uses: actions/checkout@v4
        with:
          repository: xrobot-org/XRobot
          ref: ${{ inputs.tooling_ref }}
          path: .xrobot-tools
      - name: Checkout matching LibXR candidate
        uses: actions/checkout@v4
        with:
          repository: xrobot-org/libxr
          ref: ${{ inputs.libxr_ref }}
          path: .libxr
      - name: Install source tools
        run: python3 -m pip install --force-reinstall --no-deps ./.xrobot-tools
      - name: Resolve the exact PR source and context-dependent dependencies
        run: |
          python3 .xrobot-tools/tests/prepare_module_check.py \
            --module "$XR_MODULE_ID" --repo "$XR_SOURCE_URL" \
            --ref "$XR_SOURCE_SHA" --context-ref "$XR_SOURCE_CONTEXT" \
            --directory module-check
      - name: Native configure
        run: |
          cmake -S module-check -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLIBXR_SOURCE_DIR="$GITHUB_WORKSPACE/.libxr" \
            -DLIBXR_SYSTEM="$XR_SYSTEM"
      - name: Native compile and link
        run: cmake --build build --parallel 2
      - name: Record resolved candidate sources
        uses: actions/upload-artifact@v4
        with:
          name: resolved-module-sources
          path: module-check/xrobot.lock
