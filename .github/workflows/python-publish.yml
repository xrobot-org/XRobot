name: CI/CD - Python Package

on:
  push:
    paths:
      - "**.py"
      - "**.toml"
      - "**.yml"
  pull_request:
    paths:
      - "**.py"
      - "**.toml"
      - "**.yml"
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-linux:main
      options: --user 0

    steps:
    - uses: actions/checkout@v4
    - uses: actions/checkout@v4
      with:
        repository: xrobot-org/xr-source
        ref: b6d398aee0b3bc2b76a0078db04a4ef8beff1974
        path: xr-source

    - name: Install xr-syntax candidate
      run: pip install ./xr-source


    - name: Install Python Package
      run: |
        pip install .

    - name: Require and identify the selected C++ compiler
      run: |
        command -v "$CXX"
        "$CXX" --version

    - name: Source, Git resolver and generated C++ regression tests
      run: python3 -m unittest discover -s tests -v

  build:
    name: Build & Test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: test

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Checkout xr-syntax candidate
        uses: actions/checkout@v4
        with:
          repository: xrobot-org/xr-source
          ref: b6d398aee0b3bc2b76a0078db04a4ef8beff1974
          path: xr-source

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install xr-syntax candidate
        run: python -m pip install ./xr-source

      - name: Install dependencies (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest flake8 black build twine

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          python -m pip install --upgrade pip
          if (Test-Path "requirements.txt") { pip install -r requirements.txt }
          pip install pytest flake8 black build twine

      - name: Build Package
        run: |
          python -m build

      - name: Check Package Metadata
        run: |
          twine check dist/*

      - name: Rename built package files (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          for file in dist/*.whl dist/*.tar.gz; do
            if [[ -f "$file" ]]; then
              new_name=$(echo "$file" | sed -E "s/^dist\/xrobot-([0-9]+\.[0-9]+\.[0-9]+)-py([0-9]+)-none-any\.(whl|tar.gz)$/dist\/xrobot-\1-py\2-none-any.\3/")
              if [[ "$file" != "$new_name" ]]; then
                mv "$file" "$new_name"
              fi
            fi
          done
          ls -lh dist/

      - name: Rename built package files (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Path dist/* -Include *.whl, *.tar.gz | ForEach-Object {
            $newName = $_.Name -replace '^xrobot-([0-9]+\.[0-9]+\.[0-9]+)-py([0-9]+)-none-any\.(whl|tar.gz)', 'xrobot-$1-py$2-none-any.$3'
            if ($_.Name -ne $newName) {
              Rename-Item -Path $_.FullName -NewName $newName
            }
          }
          Get-ChildItem -Path dist/

      - name: Upload Built Package
        uses: actions/upload-artifact@v4
        with:
          name: python-package-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

      - name: Install built package (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          pip install dist/*.whl || pip install dist/*.tar.gz

      - name: Install built package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pkg = Get-ChildItem dist\*.whl,dist\*.tar.gz | Select-Object -First 1
          if ($pkg) {
            pip install $pkg.FullName
          }

      - name: Candidate source regression tests
        run: python -m unittest discover -s tests -v

      - name: Import smoke check (all top-level modules)
        run: |
          python ./scripts/ci_import_smoke.py

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'

    permissions:
      id-token: write

    environment:
      name: XRobot
      url: https://pypi.org/project/xrobot

    steps:
      - name: Download built packages
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Move built packages to root dist/
        run: |
          find dist/ -mindepth 2 -type f -exec mv {} dist/ \;
          rm -rf dist/python-package-*  # 清理空文件夹
          ls -lh dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          username: XRobot
          password: ${{ secrets.TOKEN }}
