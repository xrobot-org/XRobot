name: CI/CD - Python Package

on:
  push:
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 与本地使用的版本一致；新版本可能改变格式规则。
      # The version used locally; a newer one may change the formatting rules.
      - run: python -m pip install ruff==0.16.9
      - run: ruff format --check src tests tools
      - run: ruff check src tests tools

  test:
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-linux:main
      options: --user 0
    steps:
      - uses: actions/checkout@v4

      - name: Install the package and the pinned clang-format
        # The version of the format test (tests/test_clang_format.py); it is skipped without it.
        run: pip install . clang-format==21.1.8

      - name: Require and identify the selected C++ compiler
        run: |
          command -v "$CXX"
          "$CXX" --version

      - name: Unit tests, including the generated C++ compiled with the selected compiler
        run: python3 -m unittest discover -s tests -v

  package:
    name: Build the package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  install:
    name: Install and test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Install the built wheel and the pinned clang-format
        shell: bash
        run: python -m pip install dist/*.whl clang-format==21.1.8

      # 源码在 src/ 下，tests 导入的是安装好的 wheel。
      # The sources live under src/, so the tests import the installed wheel.
      - name: Unit tests against the installed wheel
        run: python -m unittest discover -s tests -v

  release-version:
    name: Check the release tag against the package version
    runs-on: ubuntu-latest
    if: github.event_name == 'release'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # tag 是 v 加 pyproject.toml 中的版本号（RELEASE.md）。
      # The tag is v followed by the version in pyproject.toml (RELEASE.md).
      - name: Compare the tag with pyproject.toml
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          if [ "$TAG" != "v$version" ]; then
            echo "Release tag $TAG is not v$version from pyproject.toml" >&2
            exit 1
          fi

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: [install, release-version]
    if: github.event_name == 'release'
    environment:
      name: XRobot
      url: https://pypi.org/project/xrobot
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TOKEN }}
