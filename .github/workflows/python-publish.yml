name: CI/CD - Python Package

on:
  push:
  pull_request:
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 与本地使用的版本一致；新版本可能改变格式规则。
      # The version used locally; a newer one may change the formatting rules.
      - run: python -m pip install ruff==0.16.9
      - run: ruff format --check src tests tools scripts
      - run: ruff check src tests tools scripts

  test:
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    env:
      CXX: ${{ matrix.cxx }}
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/xrobot-org/docker-image-linux:main
      options: --user 0
    steps:
      - uses: actions/checkout@v4

      - name: Install the package
        run: pip install .

      - name: Require and identify the selected C++ compiler
        run: |
          command -v "$CXX"
          "$CXX" --version

      - name: Unit tests, including the generated C++ compiled with the selected compiler
        run: python3 -m unittest discover -s tests -v

  package:
    name: Build the package
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: python-package
          path: dist/*

  install:
    name: Install and test (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    needs: package
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Install the built wheel
        shell: bash
        run: python -m pip install dist/*.whl

      # 源码在 src/ 下，tests 导入的是安装好的 wheel。
      # The sources live under src/, so the tests import the installed wheel.
      - name: Unit tests against the installed wheel
        run: python -m unittest discover -s tests -v

      - name: Import every module of the installed package
        run: python scripts/ci_import_smoke.py

  publish:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    needs: install
    if: github.event_name == 'release'
    environment:
      name: XRobot
      url: https://pypi.org/project/xrobot
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: python-package
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TOKEN }}
