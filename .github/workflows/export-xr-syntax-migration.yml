name: export-xr-syntax-migration

on:
  push:
    branches:
      - feat/xr-syntax-migration-20260919

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: xrobot-migration-base
          if-no-files-found: error
          path: |
            README.md
            MIGRATION.md
            pyproject.toml
            src
            tests
            .github/workflows/python-publish.yml
