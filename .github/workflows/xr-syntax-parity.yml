name: xr-syntax migration parity

on:
  push:
    branches:
      - feat/xr-syntax-migration-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xrobot-org/xr-source
          ref: a98f0163af456498c005d912b20d3017f54d7361
          path: xr-source
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ./xr-source
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v

  public-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xrobot-org/xr-source
          ref: a98f0163af456498c005d912b20d3017f54d7361
          path: xr-source
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install ./xr-source
      - run: python -m pip install -e .
      - name: Fetch public module headers
        shell: bash
        run: |
          mkdir -p .xr-corpus
          for repo in             BlinkLED BMI088 ICM42688 IST8310 ST7735 W25QXX             MadgwickAHRS BuzzerAlarm SharedTopic SharedTopicClient CanfdIMU TestModule
          do
            git clone --depth=1 "https://github.com/xrobot-org/${repo}.git" ".xr-corpus/${repo}"
          done
      - run: python tools/check_xr_syntax_parity.py .xr-corpus
